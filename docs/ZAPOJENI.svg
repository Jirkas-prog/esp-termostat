<text x="735" y="1278" font-size="23" font-weight="bold" style="fill:#172b3a">Bistabilní alternativa · ne hlavní varianta</text>
<text x="735" y="1319" font-size="20" font-weight="normal" style="fill:#172b3a">PE014F12: 12 V cívka mezi OUT1 a OUT2.</text>
<text x="735" y="1353" font-size="19" font-weight="normal" style="fill:#172b3a">Pro 12 V použít vhodný můstek, např. DRV8871.</text>
<text x="735" y="1387" font-size="19" font-weight="bold" style="fill:#a84220">DRV8833 ze světýlek: max. 10,8 V → ne na 12 V.</text>
<text x="735" y="1421" font-size="19" font-weight="normal" style="fill:#172b3a">RELAY1 / RELAY2 → IN1 / IN2; opačné polarity.</text>
<text x="735" y="1455" font-size="19" font-weight="normal" style="fill:#172b3a">Pulz 50 ms; přestávka ≥2,1 s; externí limit buzení.</text>
<text x="735" y="1489" font-size="19" font-weight="bold" style="fill:#172b3a">Výpadek napájení může ponechat kontakt OFF.</text>
<text x="735" y="1523" font-size="19" font-weight="normal" style="fill:#172b3a">Nezávislý havarijní termostat je stále nutný.</text>
<text x="735" y="1563" font-size="18" font-weight="normal" style="fill:#172b3a">Plné podmínky, tabulka GPIO a postup: ZAPOJENI.md</text>
<text x="55" y="1637" font-size="19" font-weight="bold" style="fill:#172b3a">Síť 230 V oddělit od SELV. Žádná část výkresu nepotvrzuje skutečný průtok ani bezpečný odvod tepla.</text>
<text x="55" y="1668" font-size="18" font-weight="normal" style="fill:#172b3a">Konečný projekt vyžaduje typ čerpadla, přesné relé, návrh ochran a přejímku. Firmware 0.1.0: pouze zkušební provoz.</text>
